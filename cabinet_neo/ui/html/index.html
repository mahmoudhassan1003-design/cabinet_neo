<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cabinet Neo</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div class="app" id="app">

    <header class="app-header">
      <div class="brand">
        <div class="brand-logo" aria-hidden="true">
          <svg viewBox="0 0 32 32" width="34" height="34">
            <defs>
              <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0" stop-color="#ff8c42"/>
                <stop offset="1" stop-color="#ff5a00"/>
              </linearGradient>
            </defs>
            <path d="M16 3 L29 10 L29 22 L16 29 L3 22 L3 10 Z" fill="url(#g1)"/>
            <path d="M16 3 L29 10 L16 17 L3 10 Z" fill="#ffb37a" opacity=".55"/>
            <path d="M16 17 L29 10 L29 22 L16 29 Z" fill="#000" opacity=".18"/>
          </svg>
        </div>
        <div class="brand-text">
          <h1>Cabinet Neo</h1>
          <p data-i18n="brand.subtitle">مطبخ ذكية لـ SketchUp</p>
        </div>
      </div>

      <div class="header-right">
        <div class="su-badge">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
            <path fill="#fff" d="M12 2 22 8v8l-10 6L2 16V8z" opacity=".9"/>
          </svg>
          <span>SketchUp</span>
        </div>
        <button type="button" class="wc-btn" id="settingsBtn" data-action="settings" title="إعدادات الواجهة" aria-label="الإعدادات">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="3.2"/>
            <path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1.04 1.56V21a2 2 0 1 1-4 0v-.09a1.7 1.7 0 0 0-1.11-1.56 1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.7 1.7 0 0 0 .34-1.87 1.7 1.7 0 0 0-1.56-1.04H3a2 2 0 1 1 0-4h.09a1.7 1.7 0 0 0 1.56-1.11 1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.7 1.7 0 0 0 1.87.34h.01a1.7 1.7 0 0 0 1.03-1.56V3a2 2 0 1 1 4 0v.09a1.7 1.7 0 0 0 1.04 1.56 1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.7 1.7 0 0 0-.34 1.87v.01a1.7 1.7 0 0 0 1.56 1.03H21a2 2 0 1 1 0 4h-.09a1.7 1.7 0 0 0-1.56 1.04z"/>
          </svg>
        </button>
        <div class="lang-toggle" role="group" aria-label="Language">
          <button type="button" data-lang="ar" class="active">العربية</button>
          <button type="button" data-lang="en">English</button>
        </div>

        <div class="window-controls">
          <button type="button" class="wc-btn" id="toggleFtbBtn" title="إظهار/إخفاء الشريط العائم" aria-label="الشريط العائم">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="3" width="18" height="18" rx="2"/>
              <path d="M9 3v18"/>
            </svg>
          </button>
          <button type="button" class="wc-btn" id="wcMin" title="تصغير النافذة" aria-label="تصغير">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.2">
              <path d="M5 12h14"/>
            </svg>
          </button>
          <button type="button" class="wc-btn wc-close" id="wcClose" title="إغلاق" aria-label="إغلاق">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.2">
              <path d="M6 6l12 12M18 6L6 18"/>
            </svg>
          </button>
        </div>
      </div>
    </header>

    <nav class="app-tabs" role="tablist">
      <button class="tab active" data-tab="cabinets" role="tab">
        <svg class="tab-ico" viewBox="0 0 24 24"><path d="M3 5h18v14H3z" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M3 9h18M12 5v14" stroke="currentColor" stroke-width="1.7"/></svg>
        <span>
          <b data-i18n="tab.cabinets">مكتبة الخزائن</b>
          <em data-i18n="tab.cabinets.ar">Cabinets Library</em>
        </span>
      </button>
      <button class="tab" data-tab="styles" role="tab">
        <svg class="tab-ico" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M12 3v9l6 4" stroke="currentColor" stroke-width="1.7"/></svg>
        <span>
          <b data-i18n="tab.styles">الأنماط والتشطيبات</b>
          <em data-i18n="tab.styles.ar">Styles &amp; Finishes</em>
        </span>
      </button>
      <button class="tab" data-tab="manufacturing" role="tab">
        <svg class="tab-ico" viewBox="0 0 24 24"><path d="M6 2h9l5 5v15H6z" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M14 2v6h6" fill="none" stroke="currentColor" stroke-width="1.7"/></svg>
        <span>
          <b data-i18n="tab.mfg">التصنيع والتقارير</b>
          <em data-i18n="tab.mfg.ar">Manufacturing &amp; Reports</em>
        </span>
      </button>
    </nav>

    <div class="app-body" id="appBody">
      <aside class="sidebar">
        <div class="side-section" data-i18n="side.cabinets">الخزائن</div>

        <button class="side-item active" data-nav="library">
          <svg viewBox="0 0 24 24"><path d="M3 5h18v14H3z" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M12 5v14M3 9h18" stroke="currentColor" stroke-width="1.6"/></svg>
          <span>
            <b data-i18n="nav.library">مكتبة الخزائن</b>
            <em data-i18n="nav.library.ar">Cabinets Library</em>
          </span>
        </button>

        <button class="side-item" data-nav="wall">
          <svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="10" rx="1" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M4 20h16" stroke="currentColor" stroke-width="1.6"/></svg>
          <span>
            <b data-i18n="nav.wall">خزائن الحائط</b>
            <em data-i18n="nav.wall.ar">Wall Cabinets</em>
          </span>
        </button>

        <button class="side-item" data-nav="corner">
          <svg viewBox="0 0 24 24"><path d="M5 5h9v14H5zM14 5h5v9h-5z" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>
          <span>
            <b data-i18n="nav.corner">خزائن الركن</b>
            <em data-i18n="nav.corner.ar">Corner Cabinets</em>
          </span>
        </button>

        <button class="side-item" data-nav="special">
          <svg viewBox="0 0 24 24"><rect x="5" y="4" width="14" height="16" rx="1" fill="none" stroke="currentColor" stroke-width="1.6"/><circle cx="15" cy="12" r="1" fill="currentColor"/></svg>
          <span>
            <b data-i18n="nav.special">الوحدات الخاصة</b>
            <em data-i18n="nav.special.ar">Special Units</em>
          </span>
        </button>

        <div class="side-section" data-i18n="side.quick">إجراءات سريعة</div>

        <button class="side-item" data-nav="create" id="quickCreate">
          <svg viewBox="0 0 24 24"><path d="M12 4v16M4 12h16" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
          <span>
            <b data-i18n="nav.create">إنشاء خزانة</b>
            <em data-i18n="nav.create.ar">Create Cabinet</em>
          </span>
        </button>

        <button class="side-item" data-nav="save" id="quickSave">
          <svg viewBox="0 0 24 24"><path d="M5 4h11l3 3v13H5z" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M8 4v6h8V4M8 20v-6h8v6" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>
          <span>
            <b data-i18n="nav.save">حفظ الإعدادات</b>
            <em data-i18n="nav.save.ar">Save Settings</em>
          </span>
        </button>

        <button class="side-item" data-nav="settings" id="quickSettings">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M18.4 5.6l-2.1 2.1M7.7 16.3l-2.1 2.1" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
          <span>
            <b data-i18n="nav.settings">الإعدادات</b>
            <em data-i18n="nav.settings.ar">Interface Settings</em>
          </span>
        </button>

        <div class="side-footer">
          <svg viewBox="0 0 32 32" width="22" height="22"><path d="M16 3 29 10 29 22 16 29 3 22 3 10Z" fill="#ff6b1a"/><path d="M16 3 29 10 16 17 3 10Z" fill="#ffb37a" opacity=".6"/></svg>
          <div>
            <b>Cabinet Neo</b>
            <em data-i18n="side.tagline">تصميم · تكوين · تنفيذ</em>
          </div>
        </div>
      </aside>

      <main class="main-panel" id="mainPanel"></main>

      <aside class="right-panel" id="rightPanel"></aside>
    </div>
  </div>

  <script src="js/i18n.js"></script>
  <script src="js/bridge.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
